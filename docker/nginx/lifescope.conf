# ============================================================
# LifeScope nginx 설정
#   /            → 프론트엔드 SPA (dist/)
#   /api/*       → Spring Boot (8080)
#
# CORS 를 사용하지 않고 동일 출처로만 동작하도록 구성한다.
# (프론트와 API 를 같은 도메인에서 제공 → 브라우저 CORS 정책 우회)
# ============================================================

upstream lifescope_api {
    server app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 상위 디렉터리 탈출 방지
    client_max_body_size 1m;

    # ---- 보안 헤더 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- gzip 압축 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- actuator : 외부 비노출 (헬스체크는 내부에서만) ----
    location /actuator {
        deny all;
        return 404;
    }

    # ---- 관리자 데이터 동기화 : 인증이 없어 IP 제한으로 보호 ----
    # 배포 전에 사용자 공인 IP 를 allow 에 지정한다.
    location = /api/admin/sync {
        # allow 203.0.113.10;  # 사용자 공인 IP
        deny all;
        try_files $uri @backend;
    }

    # ---- API 프록시 ----
    location /api/ {
        proxy_pass http://lifescope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 공공 API 수집은 오래 걸릴 수 있어 타임아웃을 넉넉히 준다
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # ---- 정적 자산 (해시 파일이므로 캐시 가능) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 진입점 ----
    # 해시 라우팅을 쓰지만, 향후 히스토리 라우팅 전환 대비 fallback 을 둔다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location @backend {
        proxy_pass http://lifescope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

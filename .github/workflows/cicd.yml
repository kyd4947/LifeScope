# ============================================================
# LifeScope CI
#   - 빌드 검증 (컴파일 + 테스트)
#   - 프론트엔드 빌드
#   - main 브랜치 푸시 시 자동 배포
#
# 배포는 SSH 로 vm-1 (131.186.60.251) 에 소스를 동기화한 뒤
# 서버의 scripts/deploy.sh 를 실행하는 방식이다.
# API 키는 서버의 .env 에만 있고 저장소/GitHub 에 두지 않는다.
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_HOST: 131.186.60.251
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /opt/life-scope

jobs:
  backend:
    name: 백엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/LifeScope
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/LifeScope/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 컴파일
        run: ./gradlew compileJava --no-daemon

      - name: 테스트
        run: ./gradlew test --no-daemon

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

  deploy:
    name: 배포
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # SSH 키는 GitHub Secrets 에 등록한다 (저장소에는 두지 않는다)
      - name: SSH 키 설정
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 호스트 키 등록
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 소스 동기화 (rsync)
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.gradle' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: 서버 배포 실행
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"

      - name: 헬스체크
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://${{ env.DEPLOY_HOST }}/ || true)
            if [ "$code" = "200" ]; then
              echo "배포 성공 (HTTP $code)"
              exit 0
            fi
            echo "대기 중... ($i) HTTP $code"
            sleep 10
          done
          echo "배포 확인 실패"
          exit 1

# ============================================================
# LifeScope CI
#   - 빌드 검증 (컴파일 + 테스트)
#   - 프론트엔드 빌드
#   - main 브랜치 푸시 시 자동 배포
#
# 배포는 SSH 로 vm-1 (131.186.60.251) 에 소스를 동기화한 뒤
# 서버의 scripts/deploy.sh 를 실행하는 방식이다.
# API 키는 서버의 .env 에만 있고 저장소/GitHub 에 두지 않는다.
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_HOST: 131.186.60.251
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /opt/life-scope

jobs:
  backend:
    name: 백엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/LifeScope

    # @SpringBootTest 는 Flyway 마이그레이션과 Redis 연결을 요구하므로
    # 러너에 PostgreSQL / Redis 를 서비스 컨테이너로 기동한다.
    # (로컬의 docker-compose.yml 과 동일한 이미지 버전 사용)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lifescope
          POSTGRES_USER: lifescope
          POSTGRES_PASSWORD: lifescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifescope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      # application.yaml 은 저장소에 있으므로, 서비스 컨테이너 주소로 덮어쓴다.
      # (값은 동일하지만 의도를 명시해 두어 설정 위치를 한 곳으로 고정한다)
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lifescope
      SPRING_DATASOURCE_USERNAME: lifescope
      SPRING_DATASOURCE_PASSWORD: lifescope
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      # CI 는 devtools 가 없으므로 Redis 캐시를 사용한다
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/LifeScope/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 컴파일
        run: ./gradlew compileJava --no-daemon

      - name: 테스트
        run: ./gradlew test --no-daemon

  frontend:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

  deploy:
    name: 배포
    needs: [backend, frontend]
    # main 푸시 + PR 이 아닐 때만 실행한다.
    # SSH_PRIVATE_KEY 가 등록되지 않은 경우(= secrets 문맥 밖)에는 잡을 건너뛴다.
    # 수동 트리거(workflow_dispatch)로도 실행할 수 있다.
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: 배포 비활성화 안내
        if: env.HAS_DEPLOY_KEY != 'true'
        run: |
          echo "::notice::SSH_PRIVATE_KEY 미설정 - 배포를 건너뜁니다."
          echo "::notice::등록 방법 : Settings > Secrets and variables > Actions > New repository secret"

      - uses: actions/checkout@v4
        if: env.HAS_DEPLOY_KEY == 'true'

      # SSH 키는 GitHub Secrets 에 등록한다 (저장소에는 두지 않는다)
      - name: SSH 키 설정
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 호스트 키 등록
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 소스 동기화 (rsync)
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '.gradle' \
            ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: 서버 배포 실행
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"

      - name: 헬스체크
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://${{ env.DEPLOY_HOST }}/ || true)
            if [ "$code" = "200" ]; then
              echo "배포 성공 (HTTP $code)"
              exit 0
            fi
            echo "대기 중... ($i) HTTP $code"
            sleep 10
          done
          echo "배포 확인 실패"
          exit 1

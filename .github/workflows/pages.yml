name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 저장소형 Pages 주소는 /저장소이름/ 경로를 사용한다.
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # 백엔드 HTTPS 주소는 GitHub Variables에서 주입한다.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: API 주소 확인
        shell: bash
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::GitHub Variables에 VITE_API_BASE_URL을 설정해야 합니다."
            exit 1
          fi

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: GitHub Pages 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4

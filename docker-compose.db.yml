# ============================================================
# LifeScope PostgreSQL (vm-2 : 158.179.181.70)
#
# vm-1 의 앱과 다른 서버에 두어 데이터를 격리한다.
# 앱 컨테이너는 postgres_data 에 직접 접근하지 않고 네트워크로만 통신한다.
#
#   docker compose -f docker-compose.db.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifescope-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lifescope
      POSTGRES_USER: lifescope
      POSTGRES_PASSWORD: lifescope
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    # vm-2 의 사설 IP 에서만 포트를 게시한다.
    # 접근 가능한 출발지는 VCN 보안 리스트에서 vm-1(10.0.0.154) 로 제한한다.
    # Docker 의 게시 주소는 수신 서버인 vm-2 주소여야 한다.
    ports:
      - "10.0.0.149:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifescope -d lifescope"]
      interval: 10s
      timeout: 5s
      retries: 5

    # 리소스가 1GB 뿐이라 메모리를 아껴 쓴다
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local

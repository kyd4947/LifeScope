spring:
  application:
    name: LifeScope
  datasource:
    url: jdbc:postgresql://localhost:5432/lifescope
    username: lifescope
    password: lifescope
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-on-validation-error: false
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

app:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health, info   # 운영 헬스체크용 (Nginx/모니터링)

kosis:
  base-url: https://kosis.kr/openapi/Param/statisticsParameterData.do
  api-key: ${KOSIS_API_KEY:}   # 환경변수에서 주입 (미설정 시 수집 실행 때 명확한 에러)
  cpi-org-id: 101
  cpi-tbl-id: INH_1J22003
  cpi-itm-id: T                # URL 검증값. 0건이면 KOSIS 화면 코드로 교체
  # 임금 (고용노동부 임금통계) - KOSIS 통계표 검색 후 확정 필요
  wage-org-id: ${KOSIS_WAGE_ORG_ID:}
  wage-tbl-id: ${KOSIS_WAGE_TBL_ID:}
  wage-itm-id: ${KOSIS_WAGE_ITM_ID:}
  collect-on-startup: false    # 검증할 때만 true로 변경

molit:
  # 공공데이터포털 통합 게이트웨이 (HTTPS 443)
  # 기존 openapi.molit.go.kr:8081 은 DNS 레코드가 없어 접속 불가했다.
  base-url: https://apis.data.go.kr
  # 공공데이터포털에서 발급받은 "URL 인코딩된" 키를 그대로 사용 (재인코딩 방지)
  api-key: ${MOLIT_API_KEY:}
  num-of-rows: 1000